name: Daily Activity Automation

on:
  schedule:
    - cron: '30 3 * * *' # Executes daily at 09:00 AM IST (Mumbai Time, 03:30 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-activity:
    name: Run Activity Generator & Push Commit
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for pushing commits to repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Activity Entry
        env:
          GIT_USER_NAME: "armnJs"
          GIT_USER_EMAIL: "armaanshaikh0706@gmail.com"
        run: |
          python src/activity_logger.py

      - name: Push Changes to Repository
        run: |
          git push origin HEAD:${{ github.ref_name }}
